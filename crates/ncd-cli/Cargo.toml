[package]
name = "ncd-cli"
description = "Command-line interface for compression-based threat classification"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ncd"
path = "src/main.rs"

[dependencies]
ncd-core = { path = "../ncd-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde_json = "1.0.154"
walkdir = "2.5.0"
