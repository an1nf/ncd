[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ncdthreat"
description = "Normalized Compression Distance for threat classification (Rust core)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[tool.maturin]
features = ["pyo3/extension-module"]
