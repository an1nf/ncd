[workspace]
resolver = "3"
members = ["crates/ncd-core", "crates/ncd-cli"]
default-members = ["crates/ncd-core", "crates/ncd-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Andrés Felipe Infante Hernández"]
repository = "https://github.com/an1nf/ncd-threat"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
