[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncdeval"
version = "0.1.0"
description = "Evaluation pipeline for NCD on malware families and network flows"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
lm = ["torch", "transformers", "tokenizers"]
fetch = ["pyzipper"]

[tool.setuptools.packages.find]
include = ["ncdeval*"]

[tool.ruff]
line-length = 120
